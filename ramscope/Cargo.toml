[package]
name = "ramscope"
version = "1.0.0"
edition = "2021"
description = "RamScope - analyseur RAM / services / demarrage pour Windows"
license = "MIT"
repository = "https://github.com/Roger364/ramscope"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
roxmltree = "0.21"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true
